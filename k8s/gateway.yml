apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devboard-gateway
  namespace: devboard
spec:
  gatewayClassName: envoy
  listeners:
    # Port 80 carries the ACME challenge and HTTP redirects.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    # DevBoard HTTPS
    - name: https
      protocol: HTTPS
      port: 443
      hostname: devboard.opswithrahul.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: devboard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"

    # ArgoCD HTTPS
    - name: argocd-https
      protocol: HTTPS
      port: 443
      hostname: argocd.opswithrahul.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: devboard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
